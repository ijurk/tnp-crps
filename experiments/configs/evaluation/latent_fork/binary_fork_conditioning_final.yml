# Section 4.2.2: old-versus-mixed revealing-context acid test.
output_dir: results/synthetic_1d/binary_fork_conditioning_final_20260802_v1
base_generator_config: experiments/configs/generators/binary_latent_fork_1d.yml
device: cuda

samples_per_eval_set: 4096
eval_batch_size: 16
num_eval_samples: 256
sample_chunk_size: 64
max_batches: null
interval_levels: [0.90]

eval_set_name: binary_fork_conditioning
fork_x0: 0.0
delta: 2.0
noise_std: 0.05
branch_start: 0.5
gap_half_width_fraction: 0.25
inject_x: 1.0

# Base Nc is capped at 31 so Nc+1 remains inside the old checkpoints' max 32.
min_nc: 8
max_nc: 31
old_training_max_nc: 32

deterministic_seed: 20260842
counterfactual_seed: 20260843
sampling_seed: 20261842

sources:
  - name: Exact marginal oracle
    kind: oracle
    sampling_seed_offset: 1
    metadata:
      training_group: oracle

  - name: Old Gaussian TNP
    kind: model
    sampling_seed_offset: 2
    model_config: external/tnp/experiments/configs/models/tnp_lr_scheduler.yml
    checkpoint_path: checkpoints/binary_latent_fork/synthetic-1d-binary-latent-fork/binary-latent-fork-gaussian-baseline/binary-latent-fork-v1/last.ckpt
    overrides: []
    metadata:
      training_group: ambiguous_only
      training_generator_config: experiments/configs/generators/binary_latent_fork_1d.yml

  - name: Old Dropout CRPS-TNP
    kind: model
    sampling_seed_offset: 3
    model_config: experiments/configs/models/tnp_crps_dropout.yml
    checkpoint_path: checkpoints/binary_latent_fork/synthetic-1d-binary-latent-fork/binary-latent-fork-dropout-m4-p010/binary-latent-fork-v1/last.ckpt
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.p_dropout=0.10
      - params.crps_alpha=1.0
    metadata:
      training_group: ambiguous_only
      training_generator_config: experiments/configs/generators/binary_latent_fork_1d.yml
      training_alpha: 1.0
      training_num_samples: 4
      training_p_dropout: 0.10

  - name: Old StochLN CRPS-TNP
    kind: model
    sampling_seed_offset: 4
    model_config: experiments/configs/models/tnp_crps_stochln.yml
    checkpoint_path: checkpoints/binary_latent_fork/synthetic-1d-binary-latent-fork/binary-latent-fork-stochln-m4/binary-latent-fork-v1/last.ckpt
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.crps_alpha=1.0
      - params.layernorm_noise_dim=32
    metadata:
      training_group: ambiguous_only
      training_generator_config: experiments/configs/generators/binary_latent_fork_1d.yml
      training_alpha: 1.0
      training_num_samples: 4
      training_layernorm_noise_dim: 32

  - name: Mixed Gaussian TNP
    kind: model
    sampling_seed_offset: 5
    model_config: external/tnp/experiments/configs/models/tnp_lr_scheduler.yml
    checkpoint_path: checkpoints/binary_latent_fork/synthetic-1d-binary-latent-fork/binary-latent-fork-gaussian-baseline/binary-latent-mixctx-v1/last.ckpt
    overrides: []
    metadata:
      training_group: mixed_context
      training_generator_config: experiments/configs/generators/binary_latent_fork_1d_mixctx.yml

  - name: Mixed Dropout CRPS-TNP
    kind: model
    sampling_seed_offset: 6
    model_config: experiments/configs/models/tnp_crps_dropout.yml
    checkpoint_path: checkpoints/binary_latent_fork/synthetic-1d-binary-latent-fork/binary-latent-fork-dropout-m4-p010/binary-latent-mixctx-v1/last.ckpt
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.p_dropout=0.10
      - params.crps_alpha=1.0
    metadata:
      training_group: mixed_context
      training_generator_config: experiments/configs/generators/binary_latent_fork_1d_mixctx.yml
      training_alpha: 1.0
      training_num_samples: 4
      training_p_dropout: 0.10

  - name: Mixed StochLN CRPS-TNP
    kind: model
    sampling_seed_offset: 7
    model_config: experiments/configs/models/tnp_crps_stochln.yml
    checkpoint_path: checkpoints/binary_latent_fork/synthetic-1d-binary-latent-fork/binary-latent-fork-stochln-m4/binary-latent-mixctx-v1/last.ckpt
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.crps_alpha=1.0
      - params.layernorm_noise_dim=32
    metadata:
      training_group: mixed_context
      training_generator_config: experiments/configs/generators/binary_latent_fork_1d_mixctx.yml
      training_alpha: 1.0
      training_num_samples: 4
      training_layernorm_noise_dim: 32
