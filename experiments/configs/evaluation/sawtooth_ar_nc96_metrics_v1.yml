evaluation_mode: ar_anchors

output_dir: results/sawtooth/ar_nc96_metrics_v1
refuse_overwrite: true
device: cuda

base_generator_config: experiments/configs/generators/sawtooth_1d_interpolation_nc96.yml

num_tasks: 4096
num_ar_samples: 50
eval_batch_size: 8

# 80 initial observations + 16 AR anchors = 96.
eval_nc: 80
num_ar_anchors: 16
training_max_nc: 96

ar_anchor_range: [-2.0, 2.0]
anchor_seed: 20260720

target_order: random
stochln_noise_mode: refresh

seed: 20260720

models:
  - name: Dropout CRPS, train Nc=96
    model_config: experiments/configs/models/tnp_crps_dropout_fourier.yml
    checkpoint_path: checkpoints/sawtooth_context_ladder/synthetic-1d-sawtooth-interpolation/sawtooth-dropout-fourier-fixed-nc96/sawtooth-dropout-fourier-fixed-nc96-v1/last.ckpt
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.p_dropout=0.10
      - params.crps_alpha=1.0
      - model.use_mc_dropout=true