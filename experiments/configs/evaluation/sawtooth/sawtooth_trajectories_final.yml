output_dir: results/sawtooth/trajectories_final_20260803_v1
entity_env: WANDB_ENTITY
project: synthetic-1d-sawtooth-interpolation
api_timeout_seconds: 90

escape:
  rmse_threshold: 0.25
  sustained_checks: 5
  crps_threshold: 0.160

runs:
