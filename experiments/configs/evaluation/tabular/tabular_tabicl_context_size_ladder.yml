output_dir: results/tabular/tabicl_context_size_ladder_v1

evaluation_kind: tabular
metric_alpha: 1.0
sampling_seed: 20260730

# This is the standard context-size ladder, not the shape analysis.
num_eval_samples: 64
samples_per_eval_set: 4096
eval_batch_size: 16
max_batches: null
device: cuda

base_generator_config: experiments/configs/generators/tabular_tabicl_bank_variable_nc.yml

models:
  # Trivial baselines, recomputed independently at every context size.
  - name: context_mean
    kind: context_mean
    training_alpha: null

  - name: context_gaussian
    kind: context_gaussian
    training_alpha: null

  - name: context_resample
    kind: context_resample
    training_alpha: null

  # Models trained only at Nc = 128.
  - name: gaussian_fixed128
    model_config: experiments/configs/models/tnp_tabular_gaussian.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-gaussian-L5-H8-D128/tabicl-nc128-gaussian-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: null

  - name: dropout_fixed128
    model_config: experiments/configs/models/tnp_tabular_dropout.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-dropout-m4-p0.1-a1.0-L5-H8-D128/tabicl-nc128-dropout-m4-p010-a1-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: 1.0

  - name: stochln_fixed128
    model_config: experiments/configs/models/tnp_tabular_stochln.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-stochln-m4-z32-a1.0-L5-H8-D128/tabicl-nc128-stochln-m4-z32-a1-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: 1.0

  # Models trained across Nc in {16, 32, 64, 128}.
  - name: gaussian_varnc
    model_config: experiments/configs/models/tnp_tabular_gaussian.yml
    checkpoint_path: checkpoints/tabular_tabicl_variable_nc_500/synthetic-tabular-regression/tabular-gaussian-L5-H8-D128/tabicl-varnc-gaussian-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: null

  - name: dropout_varnc
    model_config: experiments/configs/models/tnp_tabular_dropout.yml
    checkpoint_path: checkpoints/tabular_tabicl_variable_nc_500/synthetic-tabular-regression/tabular-dropout-m4-p0.1-a1.0-L5-H8-D128/tabicl-varnc-dropout-m4-p010-a1-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: 1.0

  - name: stochln_varnc
    model_config: experiments/configs/models/tnp_tabular_stochln.yml
    checkpoint_path: checkpoints/tabular_tabicl_variable_nc_500/synthetic-tabular-regression/tabular-stochln-m4-z32-a1.0-L5-H8-D128/tabicl-varnc-stochln-m4-z32-a1-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: 1.0

eval_sets:
  - name: tabicl_nc016_test
    sampling_seed: 20260730
    overrides:
      - generators.test.source.split=test
      - generators.test.source.seed=20260728
      - generators.test.source.shuffle=false
      - generators.test.source.cycle=false
      - generators.test.deterministic=true
      - generators.test.deterministic_seed=20260728
      - generators.test.min_nc=16
      - generators.test.max_nc=16
      - generators.test.context_sizes=null

  - name: tabicl_nc032_test
    sampling_seed: 20260730
    overrides:
      - generators.test.source.split=test
