output_dir: results/tabular/tabicl_nested_ladder_final_20260804_v1

device: cuda
metric_alpha: 1.0
interval_levels: [0.90]
compute_energy_score: false
sampling_seed: 20260872
num_eval_samples: 256
sample_chunk_size: 64
eval_batch_size: 16

eval_set_name: tabicl_nested_context_ladder
base_generator_config: experiments/configs/generators/tabular_tabicl_bank_variable_nc.yml

nested_tasks:
  cache_path: results/tabular/tabicl_nested_ladder_tasks_20260804_v1.pt
  accepted_tasks: 4096
  max_scanned_tasks: null
  context_sizes:
    - 16
    - 32
    - 64
    - 128
  context_pool_size: 128
  num_targets: 128
  row_permutation_seed: 20260870
  feature_permutation_seed: 20260871
  generator_overrides:
    - generators.test.source.split=test
    - generators.test.source.seed=20260728
    - generators.test.source.shuffle=false
    - generators.test.source.cycle=false
    - generators.test.deterministic=false
    - generators.test.min_nc=16
    - generators.test.max_nc=128
    - generators.test.context_sizes=null

sources:
  - name: context_mean
    display_name: Context mean
    kind: context_mean
    training_alpha: null
    sampling_seed_offset: 1

  - name: context_gaussian
    display_name: Context Gaussian
    kind: context_gaussian
    training_alpha: null
    sampling_seed_offset: 2

  - name: context_resample
    display_name: Context resample
    kind: context_resample
    training_alpha: null
    sampling_seed_offset: 3

  - name: gaussian_fixed128
    display_name: Gaussian TNP, fixed $N_c=128$
    kind: model
    training_alpha: null
    sampling_seed_offset: 4
    model_config: experiments/configs/models/tnp_tabular_gaussian.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-gaussian-L5-H8-D128/tabicl-nc128-gaussian-500ep-seed1-v1/epoch=0499.ckpt

