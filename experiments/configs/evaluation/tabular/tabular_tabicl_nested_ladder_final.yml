source_groups:
  all:
    - context_mean
    - context_gaussian
    - context_resample
    - gaussian_fixed128
    - dropout_fixed128
    - stochln_fixed128
    - gaussian_variable
    - dropout_variable
    - stochln_variable
    - gaussian_fixed32
    - dropout_fixed32
    - stochln_fixed32
    - gaussian_fixed64
    - dropout_fixed64
    - stochln_fixed64

  fixed128_and_baselines:
    - context_mean
    - context_gaussian
    - context_resample
    - gaussian_fixed128
    - dropout_fixed128
    - stochln_fixed128

  variable:
    - gaussian_variable
    - dropout_variable
    - stochln_variable

  specialisation:
    - gaussian_fixed32
    - dropout_fixed32
    - stochln_fixed32
    - gaussian_fixed64
    - dropout_fixed64
    - stochln_fixed64

roles:
  context_resample: context_resample

architecture_roles:
  Gaussian TNP:
    fixed128: gaussian_fixed128
    variable: gaussian_variable
    specialisation:
      32: gaussian_fixed32
      64: gaussian_fixed64
      128: gaussian_fixed128
  Dropout CRPS-TNP:
    fixed128: dropout_fixed128
    variable: dropout_variable
    specialisation:
      32: dropout_fixed32
      64: dropout_fixed64
      128: dropout_fixed128
  StochLN CRPS-TNP:
    fixed128: stochln_fixed128
    variable: stochln_variable
    specialisation:
      32: stochln_fixed32
      64: stochln_fixed64
      128: stochln_fixed128

table_order:
  - context_mean
  - context_gaussian
  - context_resample
  - gaussian_fixed128
  - dropout_fixed128
  - stochln_fixed128
  - gaussian_variable
  - dropout_variable
  - stochln_variable
  - gaussian_fixed32
  - dropout_fixed32
  - stochln_fixed32
  - gaussian_fixed64
  - dropout_fixed64
  - stochln_fixed64
