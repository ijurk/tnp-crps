output_dir: results/tabular/tabicl_nc128_shape_analysis_v1

evaluation_kind: tabular
metric_alpha: 1.0
sampling_seed: 20260730

# Ordinary headline metrics still use 64 samples.
num_eval_samples: 64

shape_analysis:
  enabled: true
  headline_num_samples: 64
  sample_counts:
    - 64
    - 512
  rank_sample_count: 64
  sample_chunk_size: 64

samples_per_eval_set: 4096
eval_batch_size: 16
max_batches: null
device: cuda

base_generator_config: experiments/configs/generators/tabular_tabicl_bank_nc128.yml

models:
  - name: gaussian
    model_config: experiments/configs/models/tnp_tabular_gaussian.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-gaussian-L5-H8-D128/tabicl-nc128-gaussian-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: null

  - name: dropout
    model_config: experiments/configs/models/tnp_tabular_dropout.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-dropout-m4-p0.1-a1.0-L5-H8-D128/tabicl-nc128-dropout-m4-p010-a1-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: 1.0

  - name: stochln
    model_config: experiments/configs/models/tnp_tabular_stochln.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-stochln-m4-z32-a1.0-L5-H8-D128/tabicl-nc128-stochln-m4-z32-a1-500ep-seed1-v1/epoch=0499.ckpt
    training_alpha: 1.0

eval_sets:
  - name: tabicl_nc128_shape_test
    sampling_seed: 20260730
    overrides:
      - generators.test.source.split=test
      - generators.test.source.seed=20260728
      - generators.test.source.shuffle=false
      - generators.test.source.cycle=false
      - generators.test.deterministic=true
      - generators.test.deterministic_seed=20260728
      - generators.test.min_nc=128
      - generators.test.max_nc=128