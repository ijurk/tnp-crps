mode: headline
output_dir: results/tabular/tabicl_nc128_harmonised_final_20260804_v1

device: cuda
metric_alpha: 1.0
interval_levels: [0.90]
compute_energy_score: true
sampling_seed: 20260861
num_eval_samples: 256
consistency_num_samples: 64
sample_chunk_size: 64
samples_per_eval_set: 4096
eval_batch_size: 16
max_batches: null

eval_set_name: tabicl_nc128_test_distinct
base_generator_config: experiments/configs/generators/tabular_tabicl_bank_nc128.yml
generator_overrides:
  - generators.test.source.split=test
  - generators.test.source.seed=20260728
  - generators.test.source.shuffle=false
  - generators.test.source.cycle=false
  - generators.test.deterministic=true
  - generators.test.deterministic_seed=20260728
  - generators.test.min_nc=128
  - generators.test.max_nc=128
  - generators.test.min_nt=128
  - generators.test.max_nt=128

sources:
  - name: context_mean
    display_name: Context mean
    kind: context_mean
    training_alpha: null
    sampling_seed_offset: 1

  - name: context_gaussian
    display_name: Context Gaussian
    kind: context_gaussian
    training_alpha: null
    sampling_seed_offset: 2

  - name: context_resample
    display_name: Context resample
    kind: context_resample
    training_alpha: null
    sampling_seed_offset: 3

  - name: gaussian
    display_name: Gaussian TNP
    kind: model
    training_alpha: null
    sampling_seed_offset: 4
    model_config: experiments/configs/models/tnp_tabular_gaussian.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-gaussian-L5-H8-D128/tabicl-nc128-gaussian-500ep-seed1-v1/epoch=0499.ckpt

  - name: dropout
    display_name: Dropout CRPS-TNP
    kind: model
    training_alpha: 1.0
    sampling_seed_offset: 5
    model_config: experiments/configs/models/tnp_tabular_dropout.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-dropout-m4-p0.1-a1.0-L5-H8-D128/tabicl-nc128-dropout-m4-p010-a1-500ep-seed1-v1/epoch=0499.ckpt

  - name: stochln
    display_name: StochLN CRPS-TNP
    kind: model
    training_alpha: 1.0
    sampling_seed_offset: 6
    model_config: experiments/configs/models/tnp_tabular_stochln.yml
    checkpoint_path: checkpoints/tabular_tabicl_nc128_500/synthetic-tabular-regression/tabular-stochln-m4-z32-a1.0-L5-H8-D128/tabicl-nc128-stochln-m4-z32-a1-500ep-seed1-v1/epoch=0499.ckpt

headline_order:
  - context_mean
  - context_gaussian
  - context_resample
  - gaussian
  - dropout
  - stochln

roles:
  context_resample: context_resample
  gaussian: gaussian
  dropout: dropout
  stochln: stochln

locked_m64_metrics_path: results/tabular/tabicl_nc128_500_test_v1/metrics.csv
locked_m64_name_map:
  context_mean: context_mean
  context_gaussian: context_gaussian
  context_resample: context_resample
  gaussian: gaussian
  dropout: dropout
  stochln: stochln
