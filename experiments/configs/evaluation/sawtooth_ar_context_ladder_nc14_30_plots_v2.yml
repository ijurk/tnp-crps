output_dir: results/sawtooth/ar_context_ladder_nc14_30_plots_v2
refuse_overwrite: true
device: cuda

base_generator_config: experiments/configs/generators/sawtooth_1d_interpolation_nc14_30.yml

num_plot_samples: 256
num_sample_paths: 8

x_range: [-2.0, 2.0]
points_per_unit: 100
search_batches: 2048

# Dense query grid used after completing each AR rollout.
ar_points_per_unit: 100

# Number of complete AR rollout paths used to form the function ensemble.
num_ar_samples: 128

# Rollout traverses context sizes 14, 15, ..., 30.
num_ar_anchors: 16
training_max_nc: 30
ar_anchor_range: [-2.0, 2.0]

anchor_placement: uniform_random
anchor_seed: 20260720

denoise_chunk_size: 8

models:
  - name: Gaussian NLL, trained with Nc 1-30
    model_config: experiments/configs/models/tnp_fourier.yml
    checkpoint_path: checkpoints/sawtooth_interpolation/synthetic-1d-sawtooth-interpolation/sawtooth-gaussian-fourier/sawtooth-fourier-v1/last.ckpt
    show_sample_paths: false
    show_ar_sample_paths: true
    overrides: []

  - name: Dropout CRPS, trained with Nc 1-30
    model_config: experiments/configs/models/tnp_crps_dropout_fourier.yml
    checkpoint_path: checkpoints/sawtooth_interpolation/synthetic-1d-sawtooth-interpolation/sawtooth-dropout-fourier-m4-p010/sawtooth-fourier-v1/last.ckpt
    show_sample_paths: false
    show_ar_sample_paths: true
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.p_dropout=0.10
      - params.crps_alpha=1.0
      - model.use_mc_dropout=true

  - name: StochLN CRPS, trained with Nc 1-30
    model_config: experiments/configs/models/tnp_crps_stochln_fourier.yml
    checkpoint_path: checkpoints/sawtooth_interpolation/synthetic-1d-sawtooth-interpolation/sawtooth-stochln-fourier-m4/sawtooth-fourier-v1/last.ckpt
    show_sample_paths: false
    show_ar_sample_paths: true
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.crps_alpha=1.0
      - params.layernorm_noise_dim=32

  - name: Dropout CRPS, trained with Nc 14-30
    model_config: experiments/configs/models/tnp_crps_dropout_fourier.yml
    checkpoint_path: checkpoints/sawtooth_context_ladder/synthetic-1d-sawtooth-interpolation/sawtooth-dropout-fourier-nc14-30/sawtooth-dropout-fourier-nc14-30-v1/last.ckpt
    show_sample_paths: false
    show_ar_sample_paths: true
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.p_dropout=0.10
      - params.crps_alpha=1.0
      - model.use_mc_dropout=true

  - name: StochLN CRPS, trained with Nc 14-30
    model_config: experiments/configs/models/tnp_crps_stochln_fourier.yml
    checkpoint_path: checkpoints/sawtooth_context_ladder/synthetic-1d-sawtooth-interpolation/sawtooth-stochln-fourier-nc14-30/sawtooth-stochln-fourier-nc14-30-v1/last.ckpt
    show_sample_paths: false
    show_ar_sample_paths: true
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.crps_alpha=1.0
      - params.layernorm_noise_dim=32


  - name: Dropout CRPS, trained with Nc 14-30, alpha 0.05
    model_config: experiments/configs/models/tnp_crps_dropout_fourier.yml
    checkpoint_path: checkpoints/sawtooth_context_ladder/synthetic-1d-sawtooth-interpolation/sawtooth-dropout-fourier-nc14-30-alpha005/sawtooth-dropout-fourier-nc14-30-alpha005-v1/last.ckpt
    show_sample_paths: false
    show_ar_sample_paths: true
    overrides:
      - params.num_samples=4
      - params.val_num_samples=10
      - params.test_num_samples=64
      - params.p_dropout=0.10
      - params.crps_alpha=0.05
      - model.use_mc_dropout=true

plot_specs:
  - name: sawtooth_ar_context_ladder_nc14_task0
    figure_title: "Autoregressive sawtooth samples ($N_c=14$, $K=16$)"
    dataset: sawtooth_interpolation
    min_nc: 14
    max_nc: 14
    task_index: 0
    show_targets: false
    resample_dense_ground_truth: false
    show_ground_truth: true
    show_realised_task: true
    show_oracle_posterior: false
    y_lim: [-0.1, 1.1]

  - name: sawtooth_ar_context_ladder_nc14_task1
    figure_title: "Autoregressive sawtooth samples ($N_c=14$, $K=16$)"
    dataset: sawtooth_interpolation
    min_nc: 14
    max_nc: 14
    task_index: 1
    show_targets: false
    resample_dense_ground_truth: false
    show_ground_truth: true
    show_realised_task: true
    show_oracle_posterior: false
    y_lim: [-0.1, 1.1]

  - name: sawtooth_ar_context_ladder_nc14_task2
    figure_title: "Autoregressive sawtooth samples ($N_c=14$, $K=16$)"
    dataset: sawtooth_interpolation
    min_nc: 14
    max_nc: 14
    task_index: 2
    show_targets: false
    resample_dense_ground_truth: false
    show_ground_truth: true
    show_realised_task: true
    show_oracle_posterior: false
    y_lim: [-0.1, 1.1]