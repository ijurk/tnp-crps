model:
  _target_: tnp_crps.models.tnp_stochln.StochasticLayerNormTNP
  encoder: ${tnp_encoder}
  decoder: ${tnp_decoder}
  num_samples: ${params.num_samples}
  crps_alpha: ${params.crps_alpha}
  layernorm_noise_dim: ${params.layernorm_noise_dim}

tnp_encoder:
  _target_: tnp.models.tnp.TNPEncoder
  transformer_encoder: ${transformer_encoder}
  xy_encoder: ${xy_encoder}

transformer_encoder:
  _target_: tnp_crps.networks.transformer.StochasticLayerNormTNPTransformerEncoder
  mhsa_layer: ${mhsa_layer}
  mhca_layer: ${mhca_layer}
  num_layers: ${params.num_layers}

mhsa_layer:
  _target_: tnp_crps.networks.attention_layers.StochasticLayerNormSelfAttentionLayer
  embed_dim: ${params.embed_dim}
  num_heads: ${params.num_heads}
  head_dim: ${params.head_dim}
  feedforward_dim: ${params.embed_dim}
  norm_first: ${params.norm_first}
  p_dropout: 0.0
  noise_dim: ${params.layernorm_noise_dim}
  noise_hidden_dim: ${params.layernorm_noise_hidden_dim}

mhca_layer:
  _target_: tnp_crps.networks.attention_layers.StochasticLayerNormCrossAttentionLayer
  embed_dim: ${params.embed_dim}
  num_heads: ${params.num_heads}
  head_dim: ${params.head_dim}
  feedforward_dim: ${params.embed_dim}
  norm_first: ${params.norm_first}
  p_dropout: 0.0
  noise_dim: ${params.layernorm_noise_dim}
  noise_hidden_dim: ${params.layernorm_noise_hidden_dim}

xy_encoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:'1 + ${params.dim_y} + ${params.dim_x}'}
  out_dim: ${params.embed_dim}
  num_layers: 2
  width: ${params.embed_dim}

tnp_decoder:
  _target_: tnp.models.tnp.TNPDecoder
  z_decoder: ${z_decoder}

z_decoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${params.embed_dim}
  out_dim: ${params.dim_y}
  num_layers: 2
  width: ${params.embed_dim}

optimiser:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 5.0e-4

scheduler:
  type: warmup_cosine
  warmup:
    steps: null
    fraction: 0.1
  cosine:
    T_max: null
    eta_min: 1.0e-6

params:
  epochs: 500
  embed_dim: 128
  num_heads: 8
  head_dim: 16
  norm_first: True
  num_layers: 5
  num_samples: 4
  val_num_samples: 8
  test_num_samples: 64
  crps_alpha: 1.0
  layernorm_noise_dim: 32
  layernorm_noise_hidden_dim: null

misc:
  name: TNP-CRPS-StochLN-L${params.num_layers}-H${params.num_heads}-D${params.embed_dim}
  run_group: crps_layernorm
  run_id: null
  resume_from_checkpoint: null
  gradient_clip_val: 0.5
  plot_interval: 10
  pin_memory: false
