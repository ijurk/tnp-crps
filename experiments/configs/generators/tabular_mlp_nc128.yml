generators:
  train:
    _target_: tnp_crps.data.tabular.TabularRegressionGenerator
    source:
      _target_: tnp_crps.data.tabular_mlp.MLPTabularTaskSource
      max_input_features: 20
      device: cpu
    dim: ${params.dim_x}
    max_input_features: ${params.dim_x}
    epsilon: 1.0e-6
    min_context_target_std: 1.0e-4
    max_abs_standardized_input: 50.0
    max_abs_standardized_target: 50.0
    max_task_attempts: 32
    permute_features: true
    min_nc: 128
    max_nc: 128
    min_nt: 128
    max_nt: 128
    samples_per_epoch: 16000
    batch_size: 16

  val:
    _target_: tnp_crps.data.tabular.TabularRegressionGenerator
    source:
      _target_: tnp_crps.data.tabular_mlp.MLPTabularTaskSource
      max_input_features: 20
      device: cpu
    dim: ${params.dim_x}
    max_input_features: ${params.dim_x}
    epsilon: 1.0e-6
    min_context_target_std: 1.0e-4
    max_abs_standardized_input: 50.0
    max_abs_standardized_target: 50.0
    max_task_attempts: 32
    permute_features: true
    min_nc: 128
    max_nc: 128
    min_nt: 128
    max_nt: 128
    samples_per_epoch: 4096
    batch_size: 16
    deterministic: true
    deterministic_seed: 20260722

  test:
    _target_: tnp_crps.data.tabular.TabularRegressionGenerator
    source:
      _target_: tnp_crps.data.tabular_mlp.MLPTabularTaskSource
      max_input_features: 20
      device: cpu
    dim: ${params.dim_x}
    max_input_features: ${params.dim_x}
    epsilon: 1.0e-6
    min_context_target_std: 1.0e-4
    max_abs_standardized_input: 50.0
    max_abs_standardized_target: 50.0
    max_task_attempts: 32
    permute_features: true
    min_nc: 128
    max_nc: 128
    min_nt: 128
    max_nt: 128
    samples_per_epoch: 4096
    batch_size: 16
    deterministic: true
    deterministic_seed: 20260723

params:
  dim_x: 20
  dim_y: 1

misc:
  project: synthetic-tabular-regression
  eval_name: test
  seed: 1
  num_workers: 0
  num_val_workers: 0
  pin_memory: false
  only_plots: false
  num_plots: 10
  subplots: false
  savefig: false
  logging: false
  plot_interval: 10
  check_val_every_n_epoch: 1