generators:
  train:
    _target_: tnp_crps.data.sawtooth.SawtoothGenerator
    dim: ${params.dim_x}
    min_freq: 3.0
    max_freq: 5.0
    noise_std: 0.0
    min_nc: 1
    max_nc: 30
    min_nt: 128
    max_nt: 128
    context_range: ${params.context_range}
    target_range: ${params.target_range}
    samples_per_epoch: 16_000
    batch_size: 16

  val:
    _target_: tnp_crps.data.sawtooth.SawtoothGenerator
    dim: ${params.dim_x}
    min_freq: 3.0
    max_freq: 5.0
    noise_std: 0.0
    min_nc: 1
    max_nc: 30
    min_nt: 128
    max_nt: 128
    context_range: ${params.context_range}
    target_range: ${params.target_range}
    samples_per_epoch: 4096
    batch_size: 16
    deterministic: True

  test:
    _target_: tnp_crps.data.sawtooth.SawtoothGenerator
    dim: ${params.dim_x}
    min_freq: 3.0
    max_freq: 5.0
    noise_std: 0.0
    min_nc: 1
    max_nc: 30
    min_nt: 128
    max_nt: 128
    context_range: ${params.context_range}
    target_range: ${params.target_range}
    samples_per_epoch: 4096
    batch_size: 16
    deterministic: True

params:
  dim_x: 1
  dim_y: 1
  context_range: [[-2.0, 2.0]]
  target_range: [[-4.0, 4.0]]

misc:
  project: synthetic-1d-sawtooth
  eval_name: test
  seed: 1
  only_plots: False
  num_plots: 10
  subplots: False
  savefig: False
  logging: False
  plot_interval: 10
  check_val_every_n_epoch: 10